<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>轻阅</title>
  <style>
    :root {
      color-scheme: light;
      --native-top-inset: 0px;
      --native-bottom-inset: 0px;
      --native-ime-inset: 0px;
      --paper: #f7f5ef;
      --card: #fffef9;
      --ink: #24231f;
      --muted: #77736a;
      --line: #ddd8cc;
      --accent: #2f6958;
      --accent-soft: #dbece5;
      --note: #ffe7a3;
      --search: #81d4fa;
      --font-size: 19px;
      --line-height: 1.85;
      --paragraph-spacing: .85em;
      --doc-zoom: 1;
      --ai-dock-height: 50vh;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #171916;
      --card: #20231f;
      --ink: #ecebe4;
      --muted: #aaa99f;
      --line: #393c36;
      --accent: #8fc9b6;
      --accent-soft: #29473e;
      --note: #785f22;
      --search: #176f8f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      padding-top: var(--native-top-inset);
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Noto Sans SC", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { min-height: 44px; border: 0; color: inherit; background: transparent; }
    header {
      grid-row: 1;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) repeat(6, auto);
      align-items: center;
      gap: 4px;
      min-height: 60px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
    }
    header button { padding: 0 10px; color: var(--accent); font-weight: 700; }
    header button[aria-pressed="true"] { border-radius: 10px; background: var(--accent-soft); }
    .title { min-width: 0; padding: 0 8px; }
    .title strong, .title small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title strong { font-size: 16px; }
    .title small { margin-top: 2px; color: var(--muted); font-size: 12px; }
    #searchBar {
      grid-row: 2;
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      align-items: center;
      gap: 2px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    #searchBar[hidden] { display: none; }
    #searchInput {
      width: 100%; min-height: 40px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--paper); color: var(--ink); outline: none;
    }
    #searchInput:focus { border-color: var(--accent); }
    #searchCount { min-width: 48px; color: var(--muted); text-align: center; font-size: 13px; }
    #reader { grid-row: 3; min-height: 0; overflow: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
    body.ai-open #reader,
    body.ai-page-open #reader { scroll-padding-bottom: var(--ai-dock-height); }
    #document {
      min-height: 100%; max-width: 760px; margin: 0 auto;
      padding: 34px 24px 120px;
      white-space: pre-wrap; overflow-wrap: anywhere;
      font-family: ui-serif, "Noto Serif SC", "Songti SC", serif;
      font-size: var(--font-size); line-height: var(--line-height);
      user-select: text; -webkit-user-select: text;
    }
    #document.txt { white-space: normal; }
    #document.txt .txt-chapter {
      margin: 0; content-visibility: auto; contain-intrinsic-size: 900px;
    }
    #document.txt .txt-chapter + .txt-chapter { margin-top: var(--paragraph-spacing); }
    #document.txt .txt-chapter-heading {
      margin: 0 0 .6em; color: var(--ink); font-size: 1.3em; line-height: 1.45;
      font-weight: 750; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    #document.txt .txt-chapter-body {
      margin-top: var(--paragraph-spacing); white-space: pre-wrap; overflow-wrap: anywhere; text-align: left;
    }
    #document.txt .txt-preamble { margin-bottom: var(--paragraph-spacing); }
    #document.docx {
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
      line-height: var(--line-height); zoom: var(--doc-zoom); touch-action: pan-y;
    }
    #document.docx .docx-p { min-height: 1em; }
    #document.docx .docx-list { position: relative; padding-left: 1.35em; }
    #document.docx .docx-list::before { content: "•"; position: absolute; left: .35em; color: var(--accent); }
    #document.docx .docx-table { width: 100%; margin: 12px 0; border-collapse: collapse; table-layout: fixed; white-space: pre-wrap; }
    #document.docx .docx-table td { padding: 7px 8px; border: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
    #document.docx .docx-page-break { display: block; height: 24px; margin: 18px 0; border-top: 1px dashed var(--line); }
    #document.home {
      padding: 24px 16px 120px; white-space: normal;
      font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif;
      font-size: 16px; line-height: 1.45;
    }
    .home-view { max-width: 760px; margin: 0 auto; }
    .home-view h1 { margin: 0 0 14px; font-size: 20px; }
    .home-empty { display: grid; place-content: center; min-height: 42vh; gap: 14px; color: var(--muted); text-align: center; }
    .home-empty button { justify-self: center; padding: 0 18px; border-radius: 11px; background: var(--accent); color: var(--paper); }
    .recent-list { display: grid; gap: 8px; }
    .recent-item {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 11px;
      width: 100%; min-height: 68px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 13px; background: var(--card); text-align: left;
      touch-action: manipulation; -webkit-touch-callout: none;
    }
    .recent-item:active { background: var(--accent-soft); }
    .recent-item.pinned { border-color: var(--accent); }
    .recent-item.long-pressed { background: var(--accent-soft); }
    .recent-format {
      display: grid; place-items: center; width: 42px; height: 42px;
      border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 800;
    }
    .recent-details { min-width: 0; }
    .recent-name { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .recent-meta { display: block; margin-top: 4px; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .recent-time { align-self: start; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .recent-actions { display: grid; gap: 8px; margin-top: 8px; }
    .recent-actions button {
      min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px;
      background: var(--paper); text-align: left;
    }
    .recent-actions button:active { background: var(--accent-soft); }
    .recent-actions .danger { color: #a04437; }
    #document.loading { white-space: normal; }
    .loading-view { display: grid; gap: 12px; place-content: center; min-height: 42vh; color: var(--muted); text-align: center; }
    .loading-view strong { color: var(--ink); font-size: 18px; }
    .loading-track { width: min(280px, 72vw); height: 6px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .loading-track span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .12s ease; }
    mark.annotation { padding: 1px 0; border-bottom: 2px solid #d1a021; background: var(--note); color: inherit; cursor: pointer; }
    mark.annotation.editing { cursor: text; }
    .search-hit { border-radius: 2px; background: var(--search); }
    .search-hit.active { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer {
      grid-row: 4;
      display: grid; grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px; padding: 8px 12px calc(8px + max(var(--native-bottom-inset), env(safe-area-inset-bottom)));
      border-top: 1px solid var(--line); background: var(--card);
    }
    footer button { border-radius: 12px; font-size: 14px; font-weight: 650; }
    footer .primary { background: var(--accent); color: var(--paper); }
    footer button:disabled { opacity: .42; }
    #selectionBar {
      position: fixed; left: 0; top: 0; z-index: 20;
      transform: translate(-50%, -100%);
      padding: 6px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--ink); color: var(--paper); box-shadow: 0 8px 30px #0004;
    }
    #selectionBar[hidden] { display: none; }
    #selectionBar[data-placement="below"] { transform: translate(-50%, 0); }
    #selectionBar { display: flex; max-width: calc(100vw - 20px); overflow-x: auto; }
    #selectionBar button { min-width: 64px; padding: 0 9px; font-weight: 700; }
    .sheet-backdrop {
      position: fixed; inset: 0; z-index: 30; display: grid; align-items: end;
      padding-bottom: var(--native-ime-inset);
      background: #0007;
    }
    .sheet-backdrop[hidden] { display: none; }
    .sheet {
      max-height: 78vh; overflow: auto; padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
      border-radius: 22px 22px 0 0; background: var(--card); box-shadow: 0 -10px 40px #0003;
    }
    .sheet h2 { margin: 0 0 14px; font-size: 19px; }
    .sheet textarea {
      width: 100%; min-height: 110px; resize: vertical; padding: 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink);
    }
    .sheet-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .sheet-actions button { padding: 0 18px; border-radius: 11px; }
    .sheet-actions .save { background: var(--accent); color: var(--paper); }
    .global-note-option {
      display: flex; align-items: center; gap: 7px; min-height: 44px; margin-right: auto;
      color: var(--muted); font-size: 13px; cursor: pointer; user-select: none;
    }
    .global-note-option input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
    .global-note-option input:disabled { opacity: .6; }
    .note-item { padding: 14px 0; border-top: 1px solid var(--line); }
    .note-item:first-child { border-top: 0; }
    .note-item blockquote { margin: 0 0 7px; color: var(--muted); font-size: 13px; }
    .note-item p { margin: 0 0 10px; }
    .note-item .row { display: flex; gap: 6px; }
    .note-item button { min-height: 36px; padding: 0 12px; border-radius: 9px; background: var(--paper); color: var(--accent); }
    .setting { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); }
    .setting:first-of-type { border-top: 0; }
    .setting input { width: 100%; accent-color: var(--accent); }
    .setting output { min-width: 46px; color: var(--muted); font-size: 12px; text-align: right; }
    .setting-control { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
    .form-row { display: grid; gap: 6px; margin: 10px 0; }
    .form-row label { color: var(--muted); font-size: 13px; }
    .form-row input, .form-row select {
      width: 100%; min-height: 42px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--paper); color: var(--ink); outline: none;
    }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
    .hint { margin: 8px 0 12px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .channel-list { display: grid; gap: 6px; margin: 8px 0 14px; }
    .channel-item {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
      min-height: 46px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px;
      text-align: left;
    }
    .channel-item.active { border-color: var(--accent); background: var(--accent-soft); }
    .channel-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .channel-item .key-state { color: var(--accent); font-size: 12px; }
    .check-row { display: flex; align-items: center; gap: 8px; min-height: 42px; color: var(--muted); font-size: 13px; }
    .check-row input { accent-color: var(--accent); }
    .ai-dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      height: var(--ai-dock-height); min-height: 260px; max-height: 90vh; padding-top: 8px;
      border-top: 1px solid var(--line); background: var(--paper);
      box-shadow: 0 -10px 34px #0004;
    }
    .ai-dock[hidden] { display: none; }
    .ai-dock .sheet { width: 100%; height: 100%; max-height: none; border-radius: 18px 18px 0 0; }
    .ai-resize-handle {
      position: absolute; top: 0; left: 50%; z-index: 2;
      width: 96px; height: 24px; padding: 9px 12px 10px;
      transform: translateX(-50%); border: 0; border-radius: 99px;
      background: transparent; cursor: ns-resize; touch-action: none;
    }
    .ai-resize-handle::after {
      content: ""; display: block; width: 72px; height: 5px; margin: 0 auto;
      border-radius: 99px; background: var(--line);
    }
    .ai-resize-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
    body.ai-resizing, body.ai-resizing * { cursor: ns-resize !important; user-select: none !important; }
    .ai-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ai-head h2 { margin-bottom: 0; }
    .ai-head button { min-height: 34px; padding: 0 10px; border-radius: 8px; background: var(--paper); color: var(--accent); font-size: 12px; }
    .ai-context { margin: 0 0 10px; padding: 9px 11px; border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--ink); font-size: 13px; white-space: pre-wrap; }
    .ai-messages { min-height: 64px; max-height: max(64px, calc(var(--ai-dock-height) - 245px)); overflow: auto; padding: 2px 0; }
    .ai-message { margin: 8px 0; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    .ai-message.user { margin-left: 16%; background: var(--accent-soft); }
    .ai-message.assistant { margin-right: 8%; background: var(--paper); border: 1px solid var(--line); }
    .ai-message.pending { color: var(--muted); }
    .ai-citations { display: grid; gap: 4px; margin-top: 8px; }
    .ai-citations button { min-height: 32px; padding: 0 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); text-align: left; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-message-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ai-message-actions button { min-height: 34px; padding: 0 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
    #aiPrompt { min-height: 76px; }
    .ai-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .ai-toolbar .check-row { flex: 1; }
    .ai-toolbar select { min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
    .ai-channel-select { max-width: 44%; }
    .ai-page[hidden] { display: none; }
    .ai-page-panel {
      display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
      padding: 0; overflow: hidden;
    }
    .ai-page-head {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
      min-height: 60px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--card);
    }
    .ai-page-head h2 { margin: 0; font-size: 18px; text-align: center; }
    .ai-page-head button { min-height: 42px; padding: 0 8px; color: var(--accent); font-size: 14px; font-weight: 700; }
    .ai-page-head button:last-child { justify-self: end; }
    .ai-page-status { min-height: 38px; padding: 7px 18px 0; border-bottom: 1px solid var(--line); background: var(--paper); }
    .ai-page-status .hint { max-width: 760px; margin: 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-page-messages { min-height: 0; overflow: auto; padding: 16px 18px 22px; overscroll-behavior: contain; }
    .ai-page-messages > .hint { max-width: 760px; margin: 28px auto; text-align: center; }
    .ai-page-messages .ai-message { max-width: 760px; margin-right: auto; margin-left: auto; }
    .ai-page-messages .ai-message.user { margin-left: max(16%, calc((100% - 760px) / 2 + 48px)); }
    .ai-page-composer { padding: 10px 18px calc(12px + max(var(--native-ime-inset), env(safe-area-inset-bottom))); border-top: 1px solid var(--line); background: var(--card); }
    .ai-page-composer-inner { width: min(760px, 100%); margin: 0 auto; }
    .ai-page-composer .form-row { margin: 0; }
    .ai-page-composer textarea { width: 100%; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); outline: none; }
    .ai-page-composer textarea:focus { border-color: var(--accent); }
    #aiPagePrompt { min-height: 82px; }
    .ai-page-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .ai-page-toolbar .check-row { flex: 1; }
    .ai-page-toolbar select { min-height: 36px; max-width: 44%; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
    .ai-page-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .ai-page-actions button { min-height: 42px; padding: 0 18px; border-radius: 11px; }
    .ai-page-actions .save { background: var(--accent); color: var(--paper); }
    .danger { color: #a04437 !important; }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .segmented button { border: 1px solid var(--line); border-radius: 10px; }
    .segmented button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    #tocSheet .sheet { max-height: 82vh; }
    .toc-list { display: grid; gap: 2px; }
    .toc-item {
      min-height: 42px; padding: 7px 10px; border-radius: 9px; color: var(--ink);
      text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .toc-item:active { background: var(--accent-soft); }
    #footerZoom {
      display: flex; align-items: center; gap: 2px; padding: 2px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
    }
    #footerZoom[hidden] { display: none; }
    #footerZoom button { flex: 1; min-width: 0; min-height: 40px; padding: 0 4px; border-radius: 10px; color: var(--accent); font-weight: 750; }
    #footerZoom button:active { background: var(--accent-soft); }
    #toast {
      position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 50;
      max-width: 82vw; padding: 10px 14px; transform: translate(-50%, 12px);
      border-radius: 10px; background: var(--ink); color: var(--paper); opacity: 0; pointer-events: none;
      transition: .18s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (min-width: 700px) {
      #document { padding-inline: 54px; }
      .sheet { width: min(600px, 100%); margin: 0 auto; border-radius: 22px 22px 0 0; }
    }
    @media (max-width: 520px) {
      header { gap: 0; padding-inline: 5px; }
      header button { padding-inline: 6px; font-size: 13px; }
      .title { padding-inline: 4px; }
    }
  </style>
</head>
<body>
  <header>
    <button id="homeButton" type="button" aria-label="导入文件" onclick="openTextFile()">导入</button>
    <div class="title"><strong id="fileName">轻阅</strong><small id="status">最近打开的文件</small></div>
    <button id="searchButton" type="button" aria-label="文档内搜索" onclick="toggleSearch(true)">搜索</button>
    <button id="tocButton" type="button" aria-label="打开目录" hidden onclick="openToc()">目录</button>
    <button id="aiToggle" type="button" aria-label="打开 AI 页面" aria-pressed="false" onclick="toggleAiPage()">AI</button>
    <button id="undoButton" type="button" aria-label="撤销修改" hidden onpointerdown="event.preventDefault()" onclick="document.execCommand('undo')">撤销</button>
    <button id="redoButton" type="button" aria-label="恢复修改" hidden onpointerdown="event.preventDefault()" onclick="document.execCommand('redo')">重做</button>
    <button id="displayButton" type="button" aria-label="显示设置" onclick="onDisplayButton()">显示</button>
  </header>

  <div id="searchBar" hidden>
    <input id="searchInput" type="search" placeholder="搜索当前文档" autocomplete="off" enterkeyhint="search">
    <span id="searchCount">0/0</span>
    <button type="button" aria-label="上一个结果" onclick="moveSearch(-1)">↑</button>
    <button type="button" aria-label="下一个结果" onclick="moveSearch(1)">↓</button>
    <button type="button" aria-label="关闭搜索" onclick="toggleSearch(false)">关闭</button>
  </div>

  <main id="reader">
    <article id="document" class="home" aria-label="最近打开的文件">
      <div class="home-view"><div class="home-empty"><span>暂无最近打开的文件</span><button type="button" onclick="openTextFile()">导入 TXT / DOCX</button></div></div>
    </article>
  </main>

  <footer>
    <button id="notesButton" type="button" onclick="showNotes()" disabled>批注 0</button>
    <button id="settingsButton" type="button" onclick="openSheet('settingsSheet')">阅读设置</button>
    <div id="footerZoom" hidden role="group" aria-label="Word 缩放">
      <button type="button" aria-label="缩小" onclick="adjustDocZoom(-0.1)">−</button>
      <button id="docxZoomReset" type="button" aria-label="还原 Word 缩放，长按打开主题设置">100%</button>
      <button type="button" aria-label="放大" onclick="adjustDocZoom(0.1)">＋</button>
    </div>
    <button id="exportButton" class="primary" type="button" onclick="exportDocument()" disabled>导出原格式</button>
  </footer>

  <div id="selectionBar" hidden>
    <button type="button" onpointerdown="event.preventDefault()" onclick="copySelection()">复制</button>
    <button id="selectionNoteButton" type="button" onpointerdown="event.preventDefault()" onclick="newNote()">批注</button>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const state = {
      title: '', text: '', notes: [], recentFiles: [], recentActionUri: '', selection: null, draftSelection: null, editingId: null,
      hits: [], hitIndex: -1, ai: { selectedId: '', channels: [] }, aiMessages: [], aiPageMessages: [],
      aiAnchor: null, aiMode: 'chat', aiPendingId: '', aiPagePendingId: '', html: '', format: 'TXT', chapters: [],
      documentToken: '', textChunks: [], pendingNotes: [], loading: false, readingProgress: 0, restoringProgress: false,
      docZoom: 1, editing: false, edited: false
    };
    const doc = document.getElementById('document');
    const reader = document.getElementById('reader');
    const searchInput = document.getElementById('searchInput');
    const AI_DOCK_MIN_HEIGHT = 260;
    const AI_DOCK_MAX_RATIO = 0.9;
    let toastTimer, progressTimer, restoreTimer = 0, restoreSequence = 0, annotationTapGuardUntil = 0;
    let aiDockHeight = null, aiResizeState = null;

    function bridge(name, ...args) {
      if (window.ReaderBridge && typeof ReaderBridge[name] === 'function') return ReaderBridge[name](...args);
      return undefined;
    }

    function openTextFile() { flushReadingProgress(); bridge('openTextFile'); }
    function openRecentFile(uri) {
      if (typeof uri === 'string' && uri) { flushReadingProgress(); bridge('openRecentFile', uri); }
    }

    function bridgeJson(value) {
      if (typeof value !== 'string') return value || {};
      try { return JSON.parse(value); } catch (_) { return {}; }
    }

    window.onRecentFiles = function(value) {
      const incoming = bridgeJson(value);
      const files = Array.isArray(incoming) ? incoming : [];
      state.recentFiles = files.filter(file => file && typeof file.uri === 'string' && file.uri)
        .map(file => ({
          uri: file.uri,
          name: String(file.name || '未命名文件'),
          format: file.format === 'DOCX' ? 'DOCX' : 'TXT',
          noteCount: Number.isFinite(Number(file.noteCount)) ? Math.max(0, Number(file.noteCount)) : 0,
          modified: Boolean(file.modified) || Number(file.noteCount) > 0,
          pinned: Boolean(file.pinned),
          lastOpened: Number(file.lastOpened) || 0
        }));
      state.recentFiles.sort(compareRecentFiles);
      if (state.recentActionUri && !state.recentFiles.some(file => file.uri === state.recentActionUri)) {
        closeRecentActions();
      }
      if (!state.title) renderHome();
    };

    function compareRecentFiles(left, right) {
      return Number(right.pinned) - Number(left.pinned) || right.lastOpened - left.lastOpened;
    }

    function renderHome() {
      doc.className = 'home';
      doc.replaceChildren();
      const view = document.createElement('section');
      view.className = 'home-view';
      const heading = document.createElement('h1');
      heading.textContent = '最近打开';
      const hint = document.createElement('p');
      hint.className = 'hint'; hint.textContent = '点击打开，长按项目可置顶或删除';
      view.append(heading, hint);
      if (!state.recentFiles.length) {
        const empty = document.createElement('div');
        empty.className = 'home-empty';
        const message = document.createElement('span');
        message.textContent = '暂无最近打开的文件';
        const importButton = document.createElement('button');
        importButton.type = 'button'; importButton.textContent = '导入 TXT / DOCX';
        importButton.onclick = openTextFile;
        empty.append(message, importButton); view.append(empty);
      } else {
        const list = document.createElement('div');
        list.className = 'recent-list';
        [...state.recentFiles].sort(compareRecentFiles).forEach(file => {
          const item = document.createElement('button');
          item.type = 'button'; item.className = `recent-item${file.pinned ? ' pinned' : ''}`;
          item.title = '点击打开，长按管理项目';
          item.setAttribute('aria-label', `${file.name}${file.pinned ? '，已置顶' : ''}，点击打开，长按管理项目`);
          bindRecentItem(item, file);
          const format = document.createElement('span');
          format.className = 'recent-format'; format.textContent = file.format;
          const details = document.createElement('span');
          details.className = 'recent-details';
          const name = document.createElement('span');
          name.className = 'recent-name'; name.textContent = file.name;
          const meta = document.createElement('span');
          meta.className = 'recent-meta';
          meta.textContent = file.modified ? `已修改 · ${file.noteCount} 条批注` : '尚未添加批注';
          details.append(name, meta);
          const time = document.createElement('span');
          time.className = 'recent-time'; time.textContent = file.pinned ? `置顶 · ${recentTime(file.lastOpened)}` : recentTime(file.lastOpened);
          item.append(format, details, time); list.append(item);
        });
        view.append(list);
      }
      doc.append(view);
    }

    function bindRecentItem(item, file) {
      let pressTimer = 0;
      let longPressed = false;
      let startX = 0;
      let startY = 0;
      const clearPress = () => {
        if (pressTimer) clearTimeout(pressTimer);
        pressTimer = 0;
      };
      const finishPress = () => {
        clearPress();
        item.classList.remove('long-pressed');
      };
      item.addEventListener('pointerdown', event => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        clearPress();
        longPressed = false;
        startX = event.clientX; startY = event.clientY;
        pressTimer = setTimeout(() => {
          pressTimer = 0;
          longPressed = true;
          item.classList.add('long-pressed');
          openRecentActions(file);
          if (navigator.vibrate) navigator.vibrate(20);
        }, 550);
      });
      item.addEventListener('pointermove', event => {
        if (Math.hypot(event.clientX - startX, event.clientY - startY) > 12) clearPress();
      });
      item.addEventListener('pointerup', finishPress);
      item.addEventListener('pointercancel', finishPress);
      item.addEventListener('pointerleave', finishPress);
      item.addEventListener('contextmenu', event => {
        event.preventDefault();
        clearPress();
        longPressed = true;
        openRecentActions(file);
      });
      item.addEventListener('keydown', event => {
        if (event.key !== 'ContextMenu' && !(event.shiftKey && event.key === 'F10')) return;
        event.preventDefault();
        openRecentActions(file);
      });
      item.onclick = event => {
        if (longPressed) {
          event.preventDefault();
          longPressed = false;
          item.classList.remove('long-pressed');
          return;
        }
        openRecentFile(file.uri);
      };
    }

    function selectedRecentFile() {
      return state.recentFiles.find(file => file.uri === state.recentActionUri) || null;
    }

    function openRecentActions(file) {
      if (!file?.uri) return;
      state.recentActionUri = file.uri;
      document.getElementById('recentActionsTitle').textContent = file.name || '项目操作';
      document.getElementById('recentActionsHint').textContent = file.pinned
        ? '此项目已置顶，取消置顶后会按最近打开时间排序。'
        : '置顶后会固定在最近打开列表顶部。';
      document.getElementById('recentPinButton').textContent = file.pinned ? '取消置顶' : '置顶项目';
      openSheet('recentActionsSheet');
    }

    function closeRecentActions() {
      state.recentActionUri = '';
      closeSheet('recentActionsSheet');
    }

    function toggleRecentPinned() {
      const file = selectedRecentFile();
      if (!file) return closeRecentActions();
      file.pinned = !file.pinned;
      bridge('setRecentFilePinned', file.uri, file.pinned);
      state.recentFiles.sort(compareRecentFiles);
      closeRecentActions();
      renderHome();
      showToast(file.pinned ? '项目已置顶' : '已取消置顶');
    }

    function deleteSelectedRecent() {
      const file = selectedRecentFile();
      if (!file) return closeRecentActions();
      if (!confirm(`删除“${file.name}”？\n\n只移除轻阅中的项目记录，不会删除原文件。`)) return;
      bridge('deleteRecentFile', file.uri);
      state.recentFiles = state.recentFiles.filter(item => item.uri !== file.uri);
      closeRecentActions();
      renderHome();
      showToast('项目已删除');
    }

    function recentTime(value) {
      const date = new Date(value);
      if (!value || !Number.isFinite(date.getTime())) return '';
      return new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
    }

    function selectedAiChannel() {
      return state.ai.channels.find(channel => channel.id === state.ai.selectedId) || null;
    }

    function newId(prefix) {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function aiViewportHeight() {
      return Math.max(1, Number(window.innerHeight) || Number(document.documentElement.clientHeight) || 1);
    }

    function aiDockBounds() {
      const viewportHeight = aiViewportHeight();
      const chromeBottom = [...document.querySelectorAll('header, #searchBar')]
        .filter(element => !element.hidden)
        .reduce((bottom, element) => Math.max(bottom, element.getBoundingClientRect().bottom), 0);
      const min = AI_DOCK_MIN_HEIGHT;
      const available = Math.max(0, viewportHeight - chromeBottom);
      const max = Math.max(min, Math.min(
        Math.floor(viewportHeight * AI_DOCK_MAX_RATIO), Math.floor(available)
      ));
      return { min, max };
    }

    function clampAiDockHeight(value) {
      const { min, max } = aiDockBounds();
      const fallback = aiViewportHeight() * .5;
      const numeric = Number(value);
      return Math.round(Math.min(max, Math.max(min, Number.isFinite(numeric) ? numeric : fallback)));
    }

    function updateAiResizeHandleValues(value = aiDockHeight) {
      const { min, max } = aiDockBounds();
      const current = clampAiDockHeight(value == null ? aiViewportHeight() * .5 : value);
      document.querySelectorAll('.ai-resize-handle').forEach(handle => {
        handle.setAttribute('aria-valuemin', String(min));
        handle.setAttribute('aria-valuemax', String(max));
        handle.setAttribute('aria-valuenow', String(current));
        handle.title = `拖动调整 AI 窗口高度（${current}px）`;
      });
    }

    function setAiDockHeight(value) {
      aiDockHeight = clampAiDockHeight(value);
      document.documentElement.style.setProperty('--ai-dock-height', `${aiDockHeight}px`);
      updateAiResizeHandleValues(aiDockHeight);
      return aiDockHeight;
    }

    function currentAiDockHeight() {
      if (Number.isFinite(aiDockHeight)) return aiDockHeight;
      const visiblePanel = [...document.querySelectorAll('.ai-dock')].find(panel => !panel.hidden);
      const measured = visiblePanel?.getBoundingClientRect().height;
      return Number.isFinite(measured) && measured > 0 ? measured : aiViewportHeight() * .5;
    }

    function beginAiResize(event) {
      if (event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
      const handle = event.currentTarget;
      const panel = handle.closest('.ai-dock');
      if (!panel || panel.hidden) return;
      const startHeight = setAiDockHeight(panel.getBoundingClientRect().height);
      aiResizeState = { handle, pointerId: event.pointerId, startY: event.clientY, startHeight };
      handle.setPointerCapture?.(event.pointerId);
      document.body.classList.add('ai-resizing');
      event.preventDefault();
    }

    function moveAiResize(event) {
      if (!aiResizeState || event.isPrimary === false || event.pointerId !== aiResizeState.pointerId) return;
      setAiDockHeight(aiResizeState.startHeight + aiResizeState.startY - event.clientY);
      event.preventDefault();
    }

    function endAiResize(event) {
      if (!aiResizeState || (event.pointerId != null && event.pointerId !== aiResizeState.pointerId)) return;
      const active = aiResizeState;
      aiResizeState = null;
      document.body.classList.remove('ai-resizing');
      if (active.handle.hasPointerCapture?.(active.pointerId)) {
        active.handle.releasePointerCapture(active.pointerId);
      }
    }

    function adjustAiDockWithKeyboard(event) {
      const { min, max } = aiDockBounds();
      const current = clampAiDockHeight(currentAiDockHeight());
      const step = event.shiftKey ? 120 : 40;
      let next;
      if (event.key === 'ArrowUp') next = current + step;
      else if (event.key === 'ArrowDown') next = current - step;
      else if (event.key === 'Home') next = max;
      else if (event.key === 'End') next = min;
      else return;
      event.preventDefault();
      setAiDockHeight(next);
    }

    function setupAiResize() {
      document.querySelectorAll('.ai-resize-handle').forEach(handle => {
        handle.addEventListener('pointerdown', beginAiResize);
        handle.addEventListener('keydown', adjustAiDockWithKeyboard);
      });
      document.addEventListener('pointermove', moveAiResize, { passive: false });
      document.addEventListener('pointerup', endAiResize, { passive: false });
      document.addEventListener('pointercancel', endAiResize, { passive: false });
      window.addEventListener('blur', () => endAiResize({ pointerId: null }));
      window.addEventListener('resize', () => {
        if (Number.isFinite(aiDockHeight)) setAiDockHeight(aiDockHeight);
        else updateAiResizeHandleValues();
      });
      updateAiResizeHandleValues();
    }

    function toggleAiPage() {
      if (document.getElementById('aiPage').hidden) openAiPage();
      else closeAiPage();
    }

    function openAiPage() {
      closeAiChat();
      state.aiAnchor = null;
      state.aiMode = 'chat';
      state.selection = null;
      state.draftSelection = null;
      window.getSelection()?.removeAllRanges();
      document.getElementById('selectionBar').hidden = true;
      renderAiPageMessages();
      updateAiChannelStatus();
      document.getElementById('aiPage').hidden = false;
      document.body.classList.add('ai-page-open');
      document.getElementById('aiToggle').setAttribute('aria-pressed', 'true');
      bridge('getAiState');
    }

    function closeAiPage() {
      document.getElementById('aiPage').hidden = true;
      document.body.classList.remove('ai-page-open');
      document.getElementById('aiToggle').setAttribute('aria-pressed', 'false');
    }

    function openAiChat(keepAnchor = false) {
      closeAiPage();
      if (!keepAnchor) {
        state.aiAnchor = null;
        state.aiMode = 'chat';
      }
      updateAiContext();
      renderAiMessages();
      updateAiChannelStatus();
      document.getElementById('aiSheet').hidden = false;
      document.body.classList.add('ai-open');
      document.getElementById('aiToggle').setAttribute('aria-pressed', 'false');
      bridge('getAiState');
    }

    function closeAiChat() {
      document.getElementById('aiSheet').hidden = true;
      document.body.classList.remove('ai-open');
      if (document.getElementById('aiPage').hidden) {
        document.getElementById('aiToggle').setAttribute('aria-pressed', 'false');
      }
    }

    window.handleNativeBack = function() {
      const layeredSheets = ['aiSettingsSheet', 'noteEditor', 'notesSheet', 'settingsSheet',
        'tocSheet', 'recentActionsSheet', 'docxThemeSheet'];
      for (const id of layeredSheets) {
        const sheet = document.getElementById(id);
        if (sheet && !sheet.hidden) { closeSheet(id); return true; }
      }
      if (!document.getElementById('aiPage').hidden) { closeAiPage(); return true; }
      if (!document.getElementById('aiSheet').hidden) { closeAiChat(); return true; }
      if (!document.getElementById('searchBar').hidden) { toggleSearch(false); return true; }
      if (!document.getElementById('selectionBar').hidden) {
        window.getSelection()?.removeAllRanges();
        state.selection = null; state.draftSelection = null;
        document.getElementById('selectionBar').hidden = true;
        return true;
      }
      return false;
    };

    function openAiSettings() {
      openSheet('aiSettingsSheet');
      bridge('getAiState');
    }

    window.onAiState = function(value) {
      const incoming = bridgeJson(value);
      const channels = Array.isArray(incoming.channels) ? incoming.channels : [];
      state.ai.channels = channels.map(channel => ({
        id: String(channel.id || newId('channel')),
        name: String(channel.name || '未命名渠道'),
        protocol: channel.protocol === 'responses' ? 'responses' : 'chat',
        baseUrl: String(channel.baseUrl || ''), model: String(channel.model || ''),
        webSearch: Boolean(channel.webSearch), hasKey: Boolean(channel.hasKey)
      }));
      state.ai.selectedId = String(incoming.selectedId || '');
      if (!selectedAiChannel() && state.ai.channels.length) state.ai.selectedId = state.ai.channels[0].id;
      renderAiChannels();
      renderAiChannelSelect();
      syncAiForm();
      updateAiChannelStatus();
    };

    function renderAiChannels() {
      const list = document.getElementById('aiChannelList');
      list.replaceChildren();
      if (!state.ai.channels.length) {
        const empty = document.createElement('p');
        empty.className = 'hint'; empty.textContent = '还没有渠道。可以使用模板后再填写自己的地址和 Key。';
        list.append(empty); return;
      }
      state.ai.channels.forEach(channel => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = `channel-item${channel.id === state.ai.selectedId ? ' active' : ''}`;
        const name = document.createElement('span');
        name.textContent = channel.name || '未命名渠道';
        const detail = document.createElement('small');
        detail.textContent = `${channel.protocol === 'responses' ? 'Responses' : 'Chat'} · ${channel.model || '未填模型'}`;
        name.append(detail);
        const key = document.createElement('span');
        key.className = 'key-state'; key.textContent = channel.hasKey ? 'Key ✓' : '未配置';
      button.append(name, key); button.onclick = () => selectAiChannel(channel.id);
        list.append(button);
      });
    }

    function renderAiChannelSelect() {
      ['aiChannelSelect', 'aiPageChannelSelect'].forEach(id => {
        const select = document.getElementById(id);
        if (!select) return;
        select.replaceChildren();
        if (!state.ai.channels.length) {
          const option = document.createElement('option'); option.value = ''; option.textContent = '未配置渠道';
          select.append(option); select.disabled = true; return;
        }
        state.ai.channels.forEach(channel => {
          const option = document.createElement('option'); option.value = channel.id;
          option.textContent = channel.name || '未命名渠道'; select.append(option);
        });
        select.disabled = false; select.value = state.ai.selectedId;
      });
    }

    function selectAiChannel(id) {
      state.ai.selectedId = id;
      renderAiChannels(); renderAiChannelSelect(); syncAiForm(); updateAiChannelStatus();
    }

    function syncAiForm() {
      const channel = selectedAiChannel();
      document.getElementById('aiName').value = channel?.name || '';
      document.getElementById('aiProtocol').value = channel?.protocol || 'responses';
      document.getElementById('aiBaseUrl').value = channel?.baseUrl || '';
      document.getElementById('aiModel').value = channel?.model || '';
      document.getElementById('aiKey').value = '';
      document.getElementById('aiChannelWebSearch').checked = Boolean(channel?.webSearch);
      syncAiProtocol();
    }

    function syncAiProtocol() {
      const responses = document.getElementById('aiProtocol').value === 'responses';
      const checkbox = document.getElementById('aiChannelWebSearch');
      checkbox.disabled = !responses;
      if (!responses) checkbox.checked = false;
      document.getElementById('aiProtocolHint').textContent = responses
        ? 'Responses：可填基础地址（如 https://api.deepseek.com），应用会自动补全 /responses；也可填写完整接口地址。勾选联网后会要求服务商执行 web_search。'
        : 'Chat：可填基础地址，应用会自动补全 /chat/completions（兼容地址通常为 /v1/chat/completions）；也可填写完整接口地址。';
    }

    function newAiChannel() {
      const channel = { id: newId('channel'), name: '新渠道', protocol: 'responses', baseUrl: '', model: '', webSearch: true, hasKey: false };
      state.ai.channels.push(channel); state.ai.selectedId = channel.id;
      renderAiChannels(); renderAiChannelSelect(); syncAiForm(); updateAiChannelStatus();
      document.getElementById('aiName').focus();
    }

    function useAiPreset(protocol) {
      newAiChannel();
      const channel = selectedAiChannel();
      if (protocol === 'responses') {
        channel.name = 'OpenAI Responses'; channel.protocol = 'responses';
        channel.baseUrl = 'https://api.openai.com/v1/responses'; channel.model = 'gpt-5.4-mini'; channel.webSearch = true;
      } else {
        channel.name = 'OpenAI 兼容渠道'; channel.protocol = 'chat';
        channel.baseUrl = 'https://api.openai.com/v1/chat/completions'; channel.model = 'gpt-5.4-mini'; channel.webSearch = false;
      }
      renderAiChannels(); renderAiChannelSelect(); syncAiForm(); updateAiChannelStatus();

      return {
        selectedId: state.ai.selectedId,
        channels: state.ai.channels.map(channel => ({ ...channel }))
      };

      bridge('saveAiState', JSON.stringify(aiPayload()));
      renderAiChannels(); renderAiChannelSelect(); updateAiChannelStatus();
    }

    function saveAiChannel() {
      const channel = selectedAiChannel();
      if (!channel) return showToast('请先新增或选择一个渠道');
      const name = document.getElementById('aiName').value.trim();
      const protocol = document.getElementById('aiProtocol').value;
      const baseUrl = document.getElementById('aiBaseUrl').value.trim();
      const model = document.getElementById('aiModel').value.trim();
      const key = document.getElementById('aiKey').value.trim();
      if (!name || !baseUrl || !model) return showToast('名称、API 地址和模型名称不能为空');
      if (!baseUrl.startsWith('https://')) return showToast('API 地址必须使用 HTTPS');

      channel.baseUrl = baseUrl; channel.model = model;
      channel.webSearch = channel.protocol === 'responses' && document.getElementById('aiChannelWebSearch').checked;
      if (key) { channel.apiKey = key; channel.hasKey = true; }
      persistAiState();
      document.getElementById('aiKey').value = '';
      bridge('getAiState');
      showToast('AI 渠道已保存');

    function deleteAiChannel() {
      const channel = selectedAiChannel();
      if (!channel) return showToast('没有可删除的渠道');
      if (!confirm(`删除“${channel.name}”？`)) return;
      state.ai.channels = state.ai.channels.filter(item => item.id !== channel.id);
      state.ai.selectedId = state.ai.channels[0]?.id || '';
      persistAiState(); syncAiForm();
      showToast('渠道已删除');
    }

    function updateAiChannelStatus() {
      const channel = selectedAiChannel();
      const status = document.getElementById('aiChannelStatus');
      const search = document.getElementById('aiWebSearch');
      const pageStatus = document.getElementById('aiPageChannelStatus');
      const pageSearch = document.getElementById('aiPageWebSearch');
      if (!channel) {
        const empty = '尚未配置 AI 渠道，请打开“渠道设置”。';
        status.textContent = empty;
        if (pageStatus) pageStatus.textContent = empty;
        search.checked = false; search.disabled = true;
        if (pageSearch) { pageSearch.checked = false; pageSearch.disabled = true; }
        return;
      }
      const summary = `${channel.name} · ${channel.protocol === 'responses' ? 'Responses' : '兼容 Chat'} · ${channel.hasKey ? 'Key 已配置' : '未配置 Key'}`;
      status.textContent = summary;
      if (pageStatus) pageStatus.textContent = summary;
      search.disabled = channel.protocol !== 'responses' || !channel.webSearch;
      if (search.disabled) search.checked = false;
      if (pageSearch) {
        pageSearch.disabled = channel.protocol !== 'responses' || !channel.webSearch;
        if (pageSearch.disabled) pageSearch.checked = false;
      }
    }

    function updateAiContext() {
      const context = document.getElementById('aiContext');
      if (!state.aiAnchor) { context.hidden = true; context.textContent = ''; return; }
      context.hidden = false;
      context.textContent = `选中文字：\n“${state.aiAnchor.quote}”`;
    }

    function askSelection(kind) {
      const selection = state.selection;
      if (!selection) return showToast('请先选中一段文字');
      state.aiAnchor = { ...selection };
      state.aiMode = kind;
      state.aiMessages = [];
      window.getSelection()?.removeAllRanges();
      document.getElementById('selectionBar').hidden = true;
      const prompt = document.getElementById('aiPrompt');
      prompt.value = kind === 'explain' ? '请解释选中文字' : kind === 'translate' ? '请翻译选中文字' : '';
      openAiChat(true);
      if (selectedAiChannel()) setTimeout(() => sendAi(), 80);
      else showToast('请先在渠道设置中填写 API Key');
    }

    function copySelection() {
      if (!state.selection) return showToast('请先选中一段文字');
      if (window.ReaderBridge && typeof ReaderBridge.copyText === 'function') {
        ReaderBridge.copyText(state.selection.quote);
      } else if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(state.selection.quote)
          .then(() => showToast('已复制选中文字'))
          .catch(() => showToast('当前环境不支持复制'));
      } else {
        showToast('当前环境不支持复制');
      }
      window.getSelection()?.removeAllRanges();
      state.selection = null;
      state.draftSelection = null;
      document.getElementById('selectionBar').hidden = true;
    }

    function buildAiPrompt(raw) {
      const anchor = state.aiAnchor;
      const quote = anchor ? anchor.quote.slice(0, 8000) : '';
      if (!anchor) return raw;
      if (state.aiMode === 'explain') {
        return `请解释以下选中文字，先给简明结论，再分点说明，不要改写原文：\n\n「${quote}」`;
      }
      if (state.aiMode === 'translate') {
        const target = document.getElementById('aiTarget').value;
        return `请把以下文字翻译成${target}，只返回译文，不要添加说明：\n\n「${quote}」`;
      }
      return `请围绕以下选中文字回答用户问题。选中文字：\n「${quote}」\n\n用户问题：${raw}`;
    }

    function sendAi() {
      const channel = selectedAiChannel();
      if (!channel) { showToast('请先配置 AI 渠道'); openAiSettings(); return; }
      if (state.aiPendingId) return showToast('上一条 AI 请求还没完成');
      const raw = document.getElementById('aiPrompt').value.trim();
      if (!raw && state.aiMode === 'chat') return showToast('请输入问题');
      const prompt = buildAiPrompt(raw || (state.aiMode === 'explain' ? '请解释' : '请翻译'));
      const history = state.aiMessages.filter(message => !message.pending).slice(-8).map(message => ({ role: message.role, text: message.text }));
      const requestId = newId('ai-context');
      const anchor = state.aiAnchor ? { ...state.aiAnchor } : null;
      state.aiPendingId = requestId;
      state.aiMessages.push({ role: 'user', text: raw || (state.aiMode === 'explain' ? '讲解选中文字' : '翻译选中文字') });
      state.aiMessages.push({ role: 'assistant', text: '正在请求 AI…', pending: true, id: requestId, anchor });
      renderAiMessages();
      bridge('sendAiRequest', JSON.stringify({
        id: requestId, channelId: channel.id, prompt, history,
        webSearch: document.getElementById('aiWebSearch').checked, anchor
      }));
      document.getElementById('aiPrompt').value = '';
      state.aiMode = 'chat';
    }

    function sendAiPage() {
      const channel = selectedAiChannel();
      if (!channel) { showToast('请先配置 AI 渠道'); openAiSettings(); return; }
      if (state.aiPagePendingId) return showToast('上一条 AI 请求还没完成');
      const prompt = document.getElementById('aiPagePrompt');
      const raw = prompt.value.trim();
      if (!raw) return showToast('请输入问题');
      const history = state.aiPageMessages.filter(message => !message.pending).slice(-8)
        .map(message => ({ role: message.role, text: message.text }));
      const requestId = newId('ai-page');
      state.aiPagePendingId = requestId;
      state.aiPageMessages.push({ role: 'user', text: raw });
      state.aiPageMessages.push({ role: 'assistant', text: '正在请求 AI…', pending: true, id: requestId });
      renderAiPageMessages();
      bridge('sendAiRequest', JSON.stringify({
        id: requestId, channelId: channel.id, prompt: raw, history,
        webSearch: document.getElementById('aiPageWebSearch').checked, anchor: null
      }));
      prompt.value = '';
    }

    window.onAiResult = function(value) {
      const payload = bridgeJson(value);
      if (!payload.id) return;
      if (payload.id === state.aiPagePendingId) {
        const index = state.aiPageMessages.findIndex(message => message.pending && message.id === payload.id);
        if (index < 0) return;
        state.aiPageMessages.splice(index, 1);
        state.aiPagePendingId = '';
        state.aiPageMessages.push(payload.ok
          ? { role: 'assistant', text: String(payload.text || ''), citations: Array.isArray(payload.citations) ? payload.citations : [] }
          : { role: 'assistant', text: `请求失败：${payload.error || '未知错误'}` });
        renderAiPageMessages();
        return;
      }
      if (payload.id !== state.aiPendingId) return;
      const index = state.aiMessages.findIndex(message => message.pending && message.id === payload.id);
      if (index < 0) return;
      const requestAnchor = state.aiMessages[index].anchor || null;
      state.aiMessages.splice(index, 1);
      state.aiPendingId = '';
      state.aiMessages.push(payload.ok
        ? {
          role: 'assistant', text: String(payload.text || ''),
          citations: Array.isArray(payload.citations) ? payload.citations : [], anchor: requestAnchor
        }
        : { role: 'assistant', text: `请求失败：${payload.error || '未知错误'}` });
      renderAiMessages();
    };

    function renderAiMessages() {
      renderAiMessageList(document.getElementById('aiMessages'), state.aiMessages, true);
    }

    function renderAiPageMessages() {
      renderAiMessageList(document.getElementById('aiPageMessages'), state.aiPageMessages, false);
    }

    function renderAiMessageList(list, messages, contextual) {
      if (!list) return;
      list.replaceChildren();
      if (!messages.length) {
        const empty = document.createElement('p'); empty.className = 'hint';
        empty.textContent = contextual ? '可以先选中文字，再点击“讲解”或“翻译”。' : '直接输入问题，开始与 AI 对话。';
        list.append(empty); return;
      }
      messages.forEach((message, index) => {
        const item = document.createElement('article');
        item.className = `ai-message ${message.role}${message.pending ? ' pending' : ''}`;
        item.textContent = message.text;
        if (message.citations?.length) {
          const citations = document.createElement('div'); citations.className = 'ai-citations';
          message.citations.forEach(citation => {
            if (!citation?.url) return;
            const button = document.createElement('button'); button.type = 'button';
            button.textContent = `来源：${citation.title || citation.url}`;
            button.onclick = () => bridge('openExternalUrl', citation.url); citations.append(button);
          });
          item.append(citations);
        }
        if (contextual && message.role === 'assistant' && !message.pending && message.anchor) {
          const actions = document.createElement('div'); actions.className = 'ai-message-actions';
          const noteButton = document.createElement('button'); noteButton.type = 'button'; noteButton.textContent = '把回答加入批注';
          noteButton.onclick = () => addAiResponseAsNote(index); actions.append(noteButton); item.append(actions);
          const globalNoteButton = document.createElement('button'); globalNoteButton.type = 'button'; globalNoteButton.textContent = '把回答加入全局批注';
          globalNoteButton.onclick = () => addAiResponseAsGlobalNote(index); actions.append(globalNoteButton);
        }
        list.append(item);
      });
      list.scrollTop = list.scrollHeight;
    }

    function addAiResponseAsNote(index) {
      return addAiResponseAnnotation(index, false);
    }

    function addAiResponseAsGlobalNote(index) {
      return addAiResponseAnnotation(index, true);
    }

    function addAiResponseAnnotation(index, global) {
      const message = state.aiMessages[index];
      const anchor = message?.anchor;
      if (!message || !anchor) return;
      const result = createAnnotation(anchor, `AI：${message.text}`, global);
      if (result.error) return showToast(result.error);
      renderDocument(); renderAiMessages();
      const overwritten = result.overwritten ? `，覆盖 ${result.overwritten} 条已有批注` : '';
      showToast(global ? `AI 回答已加入全局批注（${result.count} 处${overwritten}）` : 'AI 回答已加入批注');
    }

    function onDisplayButton() {
      if (!state.title) return openSheet('settingsSheet');
      if (state.editing) return saveEdit();
      if (state.format === 'DOCX' && !state.loading) return enterEdit();
      showToast('TXT 编辑功能开发中');
    }

    function setEditingUi(editing) {
      document.getElementById('searchButton').hidden = editing;
      document.getElementById('aiToggle').hidden = editing;
      document.getElementById('undoButton').hidden = !editing;
      document.getElementById('redoButton').hidden = !editing;
      const button = document.getElementById('displayButton');
      button.textContent = editing ? '保存' : '编辑';
      button.setAttribute('aria-label', editing ? '保存修改' : '编辑文档');
