      document.getElementById('exportButton').disabled = editing;
    }

    function enterEdit() {
      if (state.format !== 'DOCX' || state.loading || state.editing) return;
      toggleSearch(false);
      closeAiPage();
      closeAiChat();
      window.getSelection()?.removeAllRanges();
      state.selection = null; state.draftSelection = null;
      document.getElementById('selectionBar').hidden = true;
      const ratio = readingProgressRatio();
      state.editing = true;
      renderDocument();
      doc.contentEditable = 'true';
      setEditingUi(true);
      requestAnimationFrame(() => {
        const maxScroll = Math.max(0, reader.scrollHeight - reader.clientHeight);
        setReaderScrollTop(Math.round(maxScroll * ratio));
      });
    }

    // Editable DOM can lose the "text nodes concatenate to state.text" invariant that
    // annotations, search and export rely on: typed Enter splits blocks without the \n
    // text node the renderer emits, and the browser inserts <br> for empty lines.
    // Repair the DOM so textContent is the new text projection.
    const DOCX_BLOCK_TAGS = new Set(['DIV', 'P', 'TABLE', 'TBODY', 'THEAD', 'TFOOT', 'TR', 'TD', 'TH',
      'UL', 'OL', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'SECTION', 'ARTICLE', 'PRE', 'HR']);
    function normalizeDocxDom(root) {
      let lastChar = '\n';
      const visit = node => {
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.data) lastChar = node.data.slice(-1);
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (node.tagName === 'BR') { node.replaceWith('\n'); lastChar = '\n'; return; }
        if (DOCX_BLOCK_TAGS.has(node.tagName) && lastChar !== '\n') {
          node.before('\n');
          lastChar = '\n';
        }
        let child = node.firstChild;
        while (child) { const next = child.nextSibling; visit(child); child = next; }
      };
      let child = root.firstChild;
      while (child) { const next = child.nextSibling; visit(child); child = next; }
    }

    function reanchorNotes(text) {
      const kept = [];
      let cursor = 0;
      for (const note of state.notes) {
        if (!note.quote) continue;
        let at = -1;
        if (note.start >= cursor && text.startsWith(note.quote, note.start)) at = note.start;
        else at = text.indexOf(note.quote, cursor);
        if (at < 0) continue;
        kept.push({ ...note, start: at, end: at + note.quote.length });
        cursor = at + note.quote.length;
      }
      return kept;
    }

    function saveEdit() {
      if (!state.editing) return;
      doc.removeAttribute('contenteditable');
      doc.querySelectorAll('mark.annotation, span.search-hit')
        .forEach(el => el.replaceWith(...el.childNodes));
      normalizeDocxDom(doc);
      doc.normalize();
      const text = doc.textContent;
      const html = doc.innerHTML;
      if (html.length > 5 * 1024 * 1024) {
        doc.contentEditable = 'true';
        return showToast('文档过大，无法保存');
      }
      const before = state.notes.length;
      state.notes = reanchorNotes(text);
      state.text = text;
      state.html = html;
      state.editing = false;
      state.edited = true;
      setEditingUi(false);
      setDocumentHeader('DOCX', text.length);
      renderDocument();
      bridge('saveEditedDocument', JSON.stringify({
        text, html, notes: state.notes, noteCount: annotationCount()
      }));
      const dropped = before - state.notes.length;
      showToast(dropped > 0 ? `修改已保存，${dropped} 条批注因原文变动已移除` : '修改已保存');
    }

    function setDocumentHeader(format, count, loading = false) {
      const kind = format === 'DOCX' ? 'DOCX' : 'TXT';
      document.getElementById('fileName').textContent = state.title;
      document.getElementById('status').textContent = loading
        ? `${kind} · 正在导入…`
        : `${kind} · ${Number(count || 0).toLocaleString()} 字符`;
      document.getElementById('homeButton').textContent = '返回';
      document.getElementById('homeButton').setAttribute('aria-label', '返回主页');
      document.getElementById('homeButton').onclick = goHome;
      document.getElementById('displayButton').textContent = '编辑';
      document.getElementById('displayButton').setAttribute('aria-label', '编辑文档');
      document.getElementById('notesButton').disabled = loading;
      document.getElementById('exportButton').disabled = loading;
      document.getElementById('exportButton').textContent = `导出 ${kind}`;
      document.getElementById('tocButton').hidden = kind !== 'TXT' || !state.chapters.length || loading;
      updateDocxZoomUi();
    }

    function renderTextLoading(percent = 0) {
      doc.className = 'loading txt';
      doc.style.removeProperty('font-size');
      doc.style.removeProperty('line-height');
      doc.replaceChildren();
      const view = document.createElement('section'); view.className = 'loading-view';
      const title = document.createElement('strong'); title.textContent = state.title || '正在打开文件';
      const message = document.createElement('span'); message.textContent = `正在整理正文 ${percent}%`;
      const track = document.createElement('div'); track.className = 'loading-track';
      const bar = document.createElement('span'); bar.style.width = `${percent}%`; track.append(bar);
      view.append(title, message, track); doc.append(view);
    }

    function scheduleIdle(task) {
      if (typeof window.requestIdleCallback === 'function') {
        window.requestIdleCallback(() => task(), { timeout: 100 });
      } else {
        setTimeout(task, 16);
      }
    }

    function updateTextLoading(percent) {
      const bar = doc.querySelector('.loading-track span');
      const message = doc.querySelector('.loading-view span');
      if (bar) bar.style.width = `${percent}%`;
      if (message) message.textContent = `正在整理正文 ${percent}%`;
      document.getElementById('status').textContent = `TXT · 正在导入 ${percent}%`;
    }

    function finishTextLoad(progress, token) {
      if (token !== state.documentToken || !state.loading) return;
      state.text = state.textChunks.join('');
      state.textChunks = [];
      state.loading = false;
      state.notes = normalizeNotes(state.pendingNotes);
      state.pendingNotes = [];
      state.editingId = null;
      state.chapters = parseTxtChapters(state.text);
      setDocumentHeader('TXT', state.text.length);
      renderDocument();
      syncAnnotationCount();
      renderToc();
      applySettings();
      restoreReadingProgress(progress);
    }

    function loadTextChunks(progress, token, totalLength) {
      let offset = 0;
      const pump = () => {
        if (token !== state.documentToken || !state.loading) return;
        const started = performance.now();
        let calls = 0;
        while (offset < totalLength && calls < 2 && performance.now() - started < 12) {
          const chunk = bridge('getTextChunk', token, offset, 96 * 1024);
          if (typeof chunk !== 'string' || !chunk.length) {
            if (token !== state.documentToken || !state.loading) return;
            state.loading = false;
            state.textChunks = []; state.pendingNotes = [];
            document.getElementById('status').textContent = 'TXT · 打开失败';
            showToast('正文读取失败，请重新导入');
            return;
          }
          state.textChunks.push(chunk);
          offset += chunk.length;
          calls++;
        }
        if (token !== state.documentToken || !state.loading) return;
        const percent = totalLength ? Math.min(100, Math.round(offset * 100 / totalLength)) : 100;
        updateTextLoading(percent);
        if (offset < totalLength) scheduleIdle(pump);
        else finishTextLoad(progress, token);
      };
      if (!totalLength) finishTextLoad(progress, token);
      else scheduleIdle(pump);
    }

    function isTxtHeading(line) {
      const candidate = line.trim().replace(/\s+/g, ' ');
      if (!candidate || candidate.length > 160) return false;
      return /^第\s*[0-9０-９零〇一二三四五六七八九十百千万两]+\s*[章节卷部篇回集](?:\s|[:：、\-—.．【】《》()（）]|$).{0,140}$/.test(candidate)
        || /^(?:卷|部)\s*[0-9０-９零〇一二三四五六七八九十百千万两]+(?:\s|[:：、\-—.．【】《》()（）]|$).{0,140}$/.test(candidate)
        || /^(?:序章|楔子|引子|尾声|终章|后记|番外(?:篇)?)(?:\s|[:：、\-—.．【】《》()（）]|$).{0,140}$/.test(candidate)
        || /^(?:chapter|part|prologue|epilogue)\b.{0,140}$/i.test(candidate);
    }

    function parseTxtChapters(text) {
      const chapters = [];
      let lineStart = 0;
      while (lineStart <= text.length) {
        const newline = text.indexOf('\n', lineStart);
        const lineEnd = newline < 0 ? text.length : newline;
        const line = text.slice(lineStart, lineEnd);
        if (isTxtHeading(line)) {
          const title = line.trim().replace(/\s+/g, ' ');
          if (!chapters.length || chapters[chapters.length - 1].start !== lineStart) {
            chapters.push({ start: lineStart, headingEnd: lineEnd, title });
          }
        }
        if (newline < 0) break;
        lineStart = newline + 1;
      }
      return chapters;
    }

    function appendTxtSection(parent, start, end, chapter, index) {
      if (end <= start && (!chapter || chapter.headingEnd <= chapter.start)) return;
      const section = document.createElement('section');
      section.className = chapter ? 'txt-chapter' : 'txt-preamble';
      if (chapter) {
        section.dataset.chapterIndex = String(index);
        const heading = document.createElement('h2');
        heading.className = 'txt-chapter-heading';
        heading.textContent = state.text.slice(chapter.start, chapter.headingEnd);
        section.append(heading);
      }
      const bodyStart = chapter ? chapter.headingEnd : start;
      if (bodyStart < end) {
        const body = document.createElement('div');
        body.className = 'txt-chapter-body';
        body.textContent = state.text.slice(bodyStart, end);
        section.append(body);
      }
      parent.append(section);
    }

    function renderTxtDocument() {
      const fragment = document.createDocumentFragment();
      const chapters = state.chapters;
      if (!chapters.length) {
        appendTxtSection(fragment, 0, state.text.length, null, -1);
        doc.append(fragment);
        return;
      }
      if (chapters[0].start > 0) appendTxtSection(fragment, 0, chapters[0].start, null, -1);
      chapters.forEach((chapter, index) => {
        const end = index + 1 < chapters.length ? chapters[index + 1].start : state.text.length;
        appendTxtSection(fragment, chapter.start, end, chapter, index);
      });
      doc.append(fragment);
    }

    function renderToc() {
      const list = document.getElementById('tocList');
      list.replaceChildren();
      state.chapters.forEach((chapter, index) => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'toc-item';
        button.textContent = `${index + 1}. ${chapter.title}`;
        button.onclick = () => jumpToChapter(index);
        list.append(button);
      });
      document.getElementById('tocButton').hidden = state.format !== 'TXT' || !state.chapters.length || state.loading;
    }

    function openToc() {
      if (state.format !== 'TXT' || !state.chapters.length) return showToast('当前文件没有可用目录');
      renderToc(); openSheet('tocSheet');
    }

    function jumpToChapter(index) {
      closeSheet('tocSheet');
      doc.querySelector(`[data-chapter-index="${index}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function updateDocxZoomUi() {
      const showZoom = state.format === 'DOCX' && !state.loading && Boolean(state.title);
      document.getElementById('footerZoom').hidden = !showZoom;
      document.getElementById('settingsButton').hidden = showZoom;
      document.documentElement.style.setProperty('--doc-zoom', String(state.docZoom));
      document.getElementById('docxZoomReset').textContent = `${Math.round(state.docZoom * 100)}%`;
    }

    function applyDocZoom() {
      const ratio = readingProgressRatio();
      updateDocxZoomUi();
      requestAnimationFrame(() => {
        const maxScroll = Math.max(0, reader.scrollHeight - reader.clientHeight);
        setReaderScrollTop(Math.round(maxScroll * ratio));
      });
    }

    function adjustDocZoom(delta) {
      if (state.format !== 'DOCX') return;
      state.docZoom = Math.max(.75, Math.min(2.5, Math.round((state.docZoom + delta) * 100) / 100));
      applyDocZoom();
    }

    function resetDocZoom() {
      if (state.format !== 'DOCX') return;
      state.docZoom = 1;
      reader.scrollLeft = 0;
      applyDocZoom();
      showToast('Word 缩放已还原为 100%');
    }

    let pinchStart = null;
    function touchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }
    doc.addEventListener('touchstart', event => {
      if (state.format === 'DOCX' && event.touches.length === 2) {
        pinchStart = { distance: touchDistance(event.touches), zoom: state.docZoom };
        event.preventDefault();
      }
    }, { passive: false });
    doc.addEventListener('touchmove', event => {
      if (!pinchStart || state.format !== 'DOCX' || event.touches.length < 2) return;
      const distance = touchDistance(event.touches);
      if (distance > 0) {
        state.docZoom = Math.max(.75, Math.min(2.5,
          Math.round(pinchStart.zoom * distance / pinchStart.distance * 100) / 100));
        applyDocZoom();
      }
      event.preventDefault();
    }, { passive: false });
    doc.addEventListener('touchend', event => {
      if (event.touches.length < 2) pinchStart = null;
    }, { passive: true });
    doc.addEventListener('touchcancel', () => { pinchStart = null; }, { passive: true });

    function setReaderScrollTop(top) {
      const previous = reader.style.scrollBehavior;
      // The stylesheet intentionally uses smooth scrolling for user actions. Explicitly
      // switch it off for restore/zoom writes or the browser only reaches an intermediate
      // position while content-visibility is still expanding.
      reader.style.scrollBehavior = 'auto';
      reader.scrollTop = Math.max(0, top);
      if (previous) reader.style.scrollBehavior = previous;
      else reader.style.removeProperty('scroll-behavior');
    }

    window.loadDocument = function(title, text, notes, format, html, progress, edited) {
      cancelProgressRestore();
      state.title = String(title || '未命名文件');
      state.text = String(text || '');
      state.textChunks = []; state.pendingNotes = [];
      state.loading = false; state.documentToken = '';
      state.format = format === 'DOCX' ? 'DOCX' : 'TXT';
      state.html = typeof html === 'string' && html ? html : '';
      state.chapters = state.format === 'TXT' ? parseTxtChapters(state.text) : [];
      state.notes = normalizeNotes(notes);
      state.selection = null; state.draftSelection = null; state.editingId = null; state.docZoom = 1;
      state.edited = state.format === 'DOCX' && Boolean(edited);
      setDocumentHeader(state.format, state.text.length);
      toggleSearch(false);
      renderDocument(); syncAnnotationCount(); renderToc(); applySettings(); updateDocxZoomUi();
      restoreReadingProgress(progress);
    };

    window.beginTextDocument = function(title, notes, progress, token, totalLength) {
      if (state.loading && state.documentToken === String(token || '')) return;
      cancelProgressRestore();
      state.title = String(title || '未命名文件'); state.text = ''; state.html = '';
      state.format = 'TXT'; state.chapters = []; state.textChunks = [];
      state.pendingNotes = Array.isArray(notes) ? notes : [];
      state.documentToken = String(token || ''); state.loading = true; state.docZoom = 1;
      state.selection = null; state.draftSelection = null; state.editingId = null; state.notes = []; state.edited = false;
      setDocumentHeader('TXT', totalLength, true); toggleSearch(false); renderTextLoading();
      loadTextChunks(progress, state.documentToken, Math.max(0, Number(totalLength) || 0));
    };

    window.goHome = function() {
      if (state.editing) {
        if (!confirm('正在编辑 Word 文档，返回将放弃未保存的修改。确定返回？')) return;
        state.editing = false;
        doc.removeAttribute('contenteditable');
        setEditingUi(false);
      }
      cancelProgressRestore();
      flushReadingProgress();
      toggleSearch(false);
      closeAiPage();
      closeAiChat();
      ['noteEditor', 'notesSheet', 'settingsSheet', 'aiSettingsSheet', 'tocSheet', 'recentActionsSheet', 'docxThemeSheet'].forEach(id => {
        document.getElementById(id).hidden = true;
      });
      window.getSelection()?.removeAllRanges();
      state.title = ''; state.text = ''; state.html = ''; state.notes = []; state.chapters = [];
      state.textChunks = []; state.pendingNotes = []; state.documentToken = '';
      state.loading = false; state.format = 'TXT'; state.docZoom = 1; state.edited = false;
      state.selection = null; state.draftSelection = null; state.editingId = null;
      state.recentActionUri = '';
      state.hits = []; state.hitIndex = -1; state.aiAnchor = null;
      state.aiMessages = []; state.aiPendingId = '';
      state.aiPageMessages = []; state.aiPagePendingId = ''; state.aiMode = 'chat';
      state.readingProgress = 0; state.restoringProgress = false;
      renderHome();
      applySettings();
      document.getElementById('fileName').textContent = '轻阅';
      document.getElementById('status').textContent = '最近打开的文件';
      document.getElementById('homeButton').textContent = '导入';
      document.getElementById('homeButton').setAttribute('aria-label', '导入文件');
      document.getElementById('homeButton').onclick = openTextFile;
      document.getElementById('displayButton').textContent = '显示';
      document.getElementById('displayButton').setAttribute('aria-label', '显示设置');
      document.getElementById('notesButton').disabled = true;
      document.getElementById('notesButton').textContent = '批注 0';
      document.getElementById('exportButton').disabled = true;
      document.getElementById('exportButton').textContent = '导出原格式';
      document.getElementById('selectionBar').hidden = true;
      document.getElementById('tocButton').hidden = true;
      updateDocxZoomUi();
      bridge('clearDocumentState');
      bridge('getRecentFiles');
      reader.scrollTop = 0;
    };

    function validNote(note) {
      return note && Number.isInteger(note.start) && Number.isInteger(note.end)
        && note.start >= 0 && note.end > note.start && note.end <= state.text.length
        && typeof note.note === 'string' && note.note.trim();
    }

    function normalizeNotes(notes) {
      const usedIds = new Set();
      return (Array.isArray(notes) ? notes : [])
        .filter(validNote)
        .map(note => {
          let id = note.id == null ? '' : String(note.id);
          if (!id || usedIds.has(id)) id = newId('note');
          usedIds.add(id);
          const quote = typeof note.quote === 'string' && note.quote
            ? note.quote : state.text.slice(note.start, note.end);
          return { ...note, id, quote, global: Boolean(note.global) };
        })
        .sort((a, b) => a.start - b.start);
    }

    function isAsciiWordChar(value) {
      return typeof value === 'string' && /^[A-Za-z0-9_]$/.test(value);
    }

    function isWholeExactMatch(text, value, start) {
      if (text.slice(start, start + value.length) !== value) return false;
      const before = text[start - 1] || '';
      const after = text[start + value.length] || '';
      // Keep fields such as RAG and GraphRAG independent. Chinese punctuation and
      // other non-ASCII characters remain valid boundaries.
      return !(isAsciiWordChar(value[0]) && isAsciiWordChar(before))
        && !(isAsciiWordChar(value[value.length - 1]) && isAsciiWordChar(after));
    }

    // Global annotations match the plain document text, case-sensitively, while
    // ignoring DOCX font/style boundaries. Embedded ASCII words are not matches.
    function exactTextRanges(quote) {
      const text = String(state.text || '');
      const value = typeof quote === 'string' ? quote : String(quote || '');
      if (!text || !value) return [];
      const ranges = [];
      let from = 0;
      while (from <= text.length - value.length) {
        const start = text.indexOf(value, from);
        if (start < 0) break;
        if (isWholeExactMatch(text, value, start)) {
          ranges.push({ start, end: start + value.length });
        }
        // Non-overlapping occurrences are the only form the current renderer can
        // represent without nested/ambiguous highlights.
        from = start + value.length;
      }
      return ranges;
    }

    function annotationRanges(note) {
      if (!note) return [];
      if (note.global) {
        const matches = exactTextRanges(note.quote);
        if (matches.length) return matches;
        // Do not resurrect a legacy global range that is now only an embedded
        // fragment (for example RAG inside GraphRAG).
        if (typeof note.quote === 'string' && Number.isInteger(note.start)
            && isWholeExactMatch(state.text, note.quote, note.start)) {
          return [{ start: note.start, end: note.start + note.quote.length }];
        }
        return [];
      }
      return Number.isInteger(note.start) && Number.isInteger(note.end) && note.end > note.start
        ? [{ start: note.start, end: note.end }] : [];
    }

    function annotationCount(notes = state.notes) {
      return (Array.isArray(notes) ? notes : [])
        .reduce((count, note) => count + annotationRanges(note).length, 0);
    }

    function rangesOverlap(left, right) {
      return left.start < right.end && right.start < left.end;
    }

    function annotationConflict(ranges, ignoredNote = null) {
      return state.notes.some(note => note !== ignoredNote && annotationRanges(note).some(existing =>
        ranges.some(candidate => rangesOverlap(candidate, existing))));
    }

    function annotationQuote(note) {
      return typeof note?.quote === 'string' && note.quote
        ? note.quote
        : Number.isInteger(note?.start) && Number.isInteger(note?.end)
          ? state.text.slice(note.start, note.end) : '';
    }

    function removeConflictingAnnotations(ranges, quote, ignoredNote = null) {
      const conflicts = state.notes.filter(note => note !== ignoredNote
        && annotationQuote(note) === quote
        && annotationRanges(note).some(existing => ranges.some(candidate => rangesOverlap(candidate, existing))));
      if (!conflicts.length) return 0;
      const conflictSet = new Set(conflicts);
      state.notes = state.notes.filter(note => !conflictSet.has(note));
      return conflicts.length;
    }

    function createAnnotation(anchor, noteText, global = false) {
      const quote = typeof anchor?.quote === 'string' ? anchor.quote : '';
      const body = String(noteText || '').trim();
      const start = Number(anchor?.start);
      const end = Number(anchor?.end);
      if (!body) return { error: '请输入批注内容' };
      if (!quote || !Number.isInteger(start) || !Number.isInteger(end) || end <= start) {
        return { error: '选区已失效，请重新选择文字' };
      }

      let selectedRange = { start, end };
      if (state.text.slice(start, end) !== quote) {
        // Keep the selected occurrence when offsets came from a styled DOCX node;
        // fall back to the first exact occurrence only if the old offset no longer fits.
        const nearby = state.text.indexOf(quote, Math.max(0, start));
        const first = nearby >= 0 ? nearby : state.text.indexOf(quote);
        if (first < 0) return { error: '全文中未找到大小写完全一致的内容' };
        selectedRange = { start: first, end: first + quote.length };
      }

      const ranges = global ? exactTextRanges(quote) : [selectedRange];
      if (!ranges.length) return { error: '全文中未找到大小写完全一致的内容' };
      if (!global && annotationConflict(ranges)) {
        return { error: '第一版暂不支持重叠批注' };
      }

      const overwritten = global ? removeConflictingAnnotations(ranges, quote) : 0;

      const anchorRange = global
        ? ranges.find(range => range.start === selectedRange.start) || ranges[0]
        : selectedRange;
      state.notes.push({
        id: newId('note'), start: anchorRange.start, end: anchorRange.end, quote,
        note: body.slice(0, 2000), createdAt: Date.now(), global: Boolean(global)
      });
      state.notes.sort((left, right) => left.start - right.start);
      persistNotes();
      return { count: ranges.length, overwritten };
    }

    function renderDocument() {
      doc.classList.remove('empty');
      doc.replaceChildren();
      doc.classList.toggle('docx', state.format === 'DOCX');
      doc.classList.toggle('txt', state.format !== 'DOCX');
      if (state.format === 'DOCX' && state.html) doc.innerHTML = state.html;
      else if (state.format === 'TXT') renderTxtDocument();
      else doc.append(document.createTextNode(state.text));
      state.notes.forEach(wrapAnnotation);
      updateNoteCount();
    }

    function restoreReadingProgress(raw) {
      const ratio = Number(raw);
      state.readingProgress = Number.isFinite(ratio) ? Math.max(0, Math.min(1, ratio)) : 0;
      state.restoringProgress = true;
      const sequence = ++restoreSequence;
      clearTimeout(restoreTimer);
      restoreTimer = 0;
      setReaderScrollTop(0);
      if (!state.readingProgress) {
        requestAnimationFrame(() => {
          if (sequence === restoreSequence) state.restoringProgress = false;
        });
        return;
      }
      // TXT chapters use content-visibility, so scrollHeight can grow as the target
      // region is laid out. Re-apply the ratio until the height is stable.
      const started = performance.now();
      const settle = () => {
        if (sequence !== restoreSequence || !state.title) return;
        const maxScroll = Math.max(0, reader.scrollHeight - reader.clientHeight);
        setReaderScrollTop(Math.round(maxScroll * state.readingProgress));
        // Keep a bounded settling window: skipped chapters can expand after the
        // first scrollHeight read even when the height looked stable for a frame.
        if (performance.now() - started >= 2000) {
          state.restoringProgress = false;
          restoreTimer = 0;
        } else {
          restoreTimer = setTimeout(settle, 50);
        }
      };
      settle();
    }

    function cancelProgressRestore() {
      restoreSequence++;
      clearTimeout(restoreTimer);
      restoreTimer = 0;
      state.restoringProgress = false;
    }

    function readingProgressRatio() {
      const maxScroll = Math.max(0, reader.scrollHeight - reader.clientHeight);
      return maxScroll ? Math.max(0, Math.min(1, reader.scrollTop / maxScroll)) : 0;
    }

    function persistReadingProgress(immediate = false) {
      if (!state.title || state.restoringProgress) return;
      const save = () => {
        progressTimer = 0;
        if (state.title && !state.restoringProgress) {
          state.readingProgress = readingProgressRatio();
          bridge('saveReadingProgress', String(state.readingProgress));
        }
      };
      clearTimeout(progressTimer);
      if (immediate) save();
      else progressTimer = setTimeout(save, 250);
    }

    window.flushReadingProgress = () => {
      cancelProgressRestore();
      persistReadingProgress(true);
    };

    function wrapAnnotation(note) {
      const ranges = annotationRanges(note);
      ranges.forEach(range => wrapAnnotationRange(note, range));
    }

    function wrapAnnotationRange(note, range) {
      const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      let cursor = 0;
      for (const node of nodes) {
        // Keep the original length: surroundContents() splits the node in place.
        const nodeLength = node.data.length;
        const start = Math.max(0, range.start - cursor);
        const end = Math.min(nodeLength, range.end - cursor);
        if (end > start) {
          const domRange = document.createRange();
          domRange.setStart(node, start); domRange.setEnd(node, end);
          const mark = document.createElement('mark');
          mark.className = state.editing ? 'annotation editing' : 'annotation'; mark.dataset.id = note.id;
          if (!state.editing) {
            mark.setAttribute('role', 'button');
            mark.title = note.global ? '点击编辑全局批注' : '点击编辑批注';
            mark.addEventListener('click', event => {
              event.stopPropagation();
              editNote(note.id);
            });
            mark.addEventListener('pointerup', event => {
              const selection = window.getSelection();
              if (selection && !selection.isCollapsed && selection.toString()) return;
              annotationTapGuardUntil = performance.now() + 500;
              event.stopPropagation();
              // Let the browser finish its synthetic click before adding the sheet;
              // otherwise that click can land on the newly opened backdrop and close it.
              setTimeout(() => {
                if (document.getElementById('noteEditor').hidden) editNote(note.id);
                setTimeout(() => { annotationTapGuardUntil = 0; }, 500);
              }, 0);
            });
            mark.addEventListener('keydown', event => {
              if (event.key !== 'Enter' && event.key !== ' ') return;
              event.preventDefault();
              editNote(note.id);
            });
          }
          domRange.surroundContents(mark);
        }
        cursor += nodeLength;
        if (cursor >= range.end) break;
      }
    }

    document.addEventListener('selectionchange', () => {
      if (state.editing) {
        state.selection = null;
        document.getElementById('selectionBar').hidden = true;
        return;
      }
      const selection = getDocumentSelection();
      state.selection = selection;
      const bar = document.getElementById('selectionBar');
      bar.hidden = !selection;
      const noteButton = document.getElementById('selectionNoteButton');
      if (noteButton) noteButton.textContent = noteForSelection(selection) ? '编辑批注' : '批注';
      if (selection) requestAnimationFrame(positionSelectionBar);
    });

    function positionSelectionBar() {
      const bar = document.getElementById('selectionBar');
      if (bar.hidden || !state.selection) return;
      const nativeSelection = window.getSelection();
      if (!nativeSelection || nativeSelection.rangeCount === 0) return;
      const rect = nativeSelection.getRangeAt(0).getBoundingClientRect();
      if (!rect.width && !rect.height) return;
      const margin = 8;
      const width = bar.offsetWidth;
      const height = bar.offsetHeight;
      const viewportWidth = document.documentElement.clientWidth;
      const viewportHeight = window.innerHeight;
      const safeBottom = document.body.classList.contains('ai-open')
        ? Math.floor(viewportHeight * .5) : viewportHeight;
      const center = Math.max(width / 2 + margin,
        Math.min(viewportWidth - width / 2 - margin, rect.left + rect.width / 2));
      const above = rect.top - height - margin;
      const below = rect.bottom + margin;
      if (above >= margin) {
        bar.dataset.placement = 'above';
        bar.style.top = `${rect.top - margin}px`;
      } else if (below + height <= safeBottom - margin) {
        bar.dataset.placement = 'below';
        bar.style.top = `${below}px`;
      } else {
        bar.dataset.placement = 'above';
        bar.style.top = `${Math.max(height + margin, safeBottom - margin)}px`;
      }
      bar.style.left = `${center}px`;
    }

    reader.addEventListener('scroll', () => {
      if (!document.getElementById('selectionBar').hidden) requestAnimationFrame(positionSelectionBar);
      persistReadingProgress();
    }, { passive: true });
    reader.addEventListener('wheel', () => {
      if (state.restoringProgress) cancelProgressRestore();
    }, { passive: true });
    reader.addEventListener('touchstart', () => {
      if (state.restoringProgress) cancelProgressRestore();
    }, { passive: true });
    window.addEventListener('resize', positionSelectionBar);

    function getDocumentSelection() {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return null;
      const range = selection.getRangeAt(0);
      if (!doc.contains(range.commonAncestorContainer)) return null;
      const beforeStart = document.createRange();
      beforeStart.selectNodeContents(doc);
      beforeStart.setEnd(range.startContainer, range.startOffset);
      const beforeEnd = document.createRange();
      beforeEnd.selectNodeContents(doc);
      beforeEnd.setEnd(range.endContainer, range.endOffset);
      const start = beforeStart.toString().length;
      const end = beforeEnd.toString().length;
      return end > start ? { start, end, quote: state.text.slice(start, end) } : null;
    }

    function noteForSelection(selection) {
      if (!selection) return null;
      return state.notes.find(note => annotationRanges(note).some(range =>
        selection.start >= range.start && selection.end <= range.end)) || null;
    }

    function newNote() {
      if (!state.selection) return;
      const existing = noteForSelection(state.selection);
      if (existing) return editNote(existing.id);
      state.draftSelection = { ...state.selection };
      state.editingId = null;
      document.getElementById('noteTitle').textContent = '添加批注';
      document.getElementById('noteText').value = '';
      const globalToggle = document.getElementById('globalNote');
      globalToggle.checked = false;
      globalToggle.disabled = false;
      document.getElementById('deleteNoteButton').hidden = true;
      openSheet('noteEditor');
      setTimeout(() => document.getElementById('noteText').focus(), 80);
    }

    function saveNote() {
      const noteText = document.getElementById('noteText').value.trim();
      if (!noteText) return showToast('请输入批注内容');
      if (state.editingId !== null) {
        const note = state.notes.find(item => String(item.id) === String(state.editingId));
        if (!note) return showToast('批注已失效，请重新选择文字');
        const wasGlobal = Boolean(note.global);
        const nextGlobal = document.getElementById('globalNote').checked;
        let globalCount = 0;
        let overwritten = 0;
        if (nextGlobal) {
          const quote = state.text.slice(note.start, note.end);
          const ranges = exactTextRanges(quote);
          if (!ranges.length) return showToast('全文中未找到大小写完全一致的内容');
          const anchorRange = ranges.find(range => range.start === note.start) || ranges[0];
          note.quote = quote;
          note.start = anchorRange.start;
          note.end = anchorRange.end;
          note.global = true;
          globalCount = ranges.length;
          // A global annotation replaces only annotations for the same exact quote;
          // different phrases may share characters without deleting each other.
          overwritten = removeConflictingAnnotations(ranges, quote, note);
        } else if (wasGlobal) {
          const range = { start: note.start, end: note.end };
          if (annotationConflict([range], note)) {
            return showToast('当前范围与其他批注重叠');
          }
          note.quote = state.text.slice(range.start, range.end);
          note.start = range.start;
          note.end = range.end;
          note.global = false;
        }
        note.note = noteText;
        persistNotes();
        closeSheet('noteEditor');
        state.editingId = null;
        window.getSelection()?.removeAllRanges();
        state.selection = null;
        state.draftSelection = null;
        renderDocument();
        showToast(note.global
          ? `全局批注已更新（${globalCount} 处${overwritten ? `，覆盖 ${overwritten} 条已有批注` : ''}）`
          : '批注已保存');
        return;
      } else if (state.draftSelection) {
        const global = document.getElementById('globalNote').checked;
        const result = createAnnotation(state.draftSelection, noteText, global);
        if (result.error) return showToast(result.error);
        closeSheet('noteEditor');
        state.editingId = null;
        window.getSelection()?.removeAllRanges();
        state.selection = null;
        state.draftSelection = null;
        renderDocument();
        const overwritten = result.overwritten ? `，覆盖 ${result.overwritten} 条已有批注` : '';
        showToast(global ? `全局批注已保存（${result.count} 处${overwritten}）` : '批注已保存');
        return;
      } else return showToast('选区已失效，请重新选择文字');
    }

    function editNote(id) {
      const note = state.notes.find(item => String(item.id) === String(id));
      if (!note) return;
      state.editingId = note.id;
      state.draftSelection = null;
      window.getSelection()?.removeAllRanges();
      state.selection = null;
      document.getElementById('selectionBar').hidden = true;
      document.getElementById('noteTitle').textContent = note.global ? '编辑全局批注' : '编辑批注';
      document.getElementById('noteText').value = note.note;
      const globalToggle = document.getElementById('globalNote');
      globalToggle.checked = Boolean(note.global);
      globalToggle.disabled = false;
      document.getElementById('deleteNoteButton').hidden = false;
      closeSheet('notesSheet');
      openSheet('noteEditor');
      const editor = document.getElementById('noteText');
      const focusEditorAtTop = () => {
        if (document.getElementById('noteEditor').hidden) return;
        editor.focus();
        // Existing annotations can span many lines. Start at the beginning so
        // opening a note always shows its first line instead of the last one.
        editor.setSelectionRange(0, 0);
        editor.scrollTop = 0;
      };
      focusEditorAtTop();
      setTimeout(focusEditorAtTop, 80);
    }

    function deleteNoteRecord(id) {
      const before = state.notes.length;
      state.notes = state.notes.filter(note => String(note.id) !== String(id));
      if (state.notes.length === before) return false;
      persistNotes();
      renderDocument();
      return true;
    }

    function deleteEditingNote() {
      const id = state.editingId;
      if (id === null) return;
      if (!confirm('删除这条批注？')) return;
      const deleted = deleteNoteRecord(id);
      closeSheet('noteEditor');
      state.editingId = null;
      state.selection = null;
      state.draftSelection = null;
      window.getSelection()?.removeAllRanges();
      document.getElementById('deleteNoteButton').hidden = true;
      showToast(deleted ? '批注已删除' : '批注已失效');
    }

    function removeNote(id) {
      if (!confirm('删除这条批注？')) return;
      if (deleteNoteRecord(id)) {
        showNotes();
        showToast('批注已删除');
      }
    }

    function persistNotes() {
      bridge('saveAnnotations', JSON.stringify({ notes: state.notes, noteCount: annotationCount() }));
      updateNoteCount();
    }

    function syncAnnotationCount() {
      if (state.notes.length && annotationCount() !== state.notes.length) persistNotes();
    }

    function updateNoteCount() {
      document.getElementById('notesButton').textContent = `批注 ${annotationCount()}`;
    }

    function showNotes() {
      if (!state.text) return;
      const list = document.getElementById('notesList');
      list.replaceChildren();
      if (!state.notes.length) {
        const empty = document.createElement('p');
        empty.textContent = '还没有批注。选中文字后点击“添加批注”。';
        empty.style.color = 'var(--muted)';
        list.append(empty);
      }
      state.notes.forEach(note => {
        const item = document.createElement('article');
        item.className = 'note-item';
        const quote = document.createElement('blockquote');
        const places = annotationRanges(note).length;
        quote.textContent = `“${state.text.slice(note.start, note.end)}”`
          + (note.global ? `（全局 · ${places} 处）` : '');
        const text = document.createElement('p');
        text.textContent = note.note;
        const row = document.createElement('div');
        row.className = 'row';
        [['跳转', () => jumpToNote(note.id)], ['编辑', () => editNote(note.id)], ['删除', () => removeNote(note.id)]].forEach(([label, action]) => {
          const button = document.createElement('button');
          button.type = 'button'; button.textContent = label; button.onclick = action; row.append(button);
        });
        item.append(quote, text, row); list.append(item);
      });
      openSheet('notesSheet');
    }

    function jumpToNote(id) {
      closeSheet('notesSheet');
      renderDocument();
      const mark = doc.querySelector(`mark[data-id="${CSS.escape(id)}"]`);
      mark?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function toggleSearch(open) {
      document.getElementById('searchBar').hidden = !open;
      if (Number.isFinite(aiDockHeight)) setAiDockHeight(aiDockHeight);
      else updateAiResizeHandleValues();
      if (open) setTimeout(() => searchInput.focus(), 50);
      else { searchInput.value = ''; clearSearch(); }
    }

    searchInput.addEventListener('input', () => runSearch(searchInput.value));
    searchInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') { event.preventDefault(); moveSearch(event.shiftKey ? -1 : 1); }
      if (event.key === 'Escape') toggleSearch(false);
    });

    function clearSearch() {
      doc.querySelectorAll('.search-hit').forEach(hit => hit.replaceWith(document.createTextNode(hit.textContent)));
      doc.normalize();
      state.hits = []; state.hitIndex = -1;
      document.getElementById('searchCount').textContent = '0/0';
    }

    function runSearch(rawQuery) {
      clearSearch();
      const query = rawQuery.trim().toLocaleLowerCase();
      if (!query || !state.text) return;
      const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        const source = node.data;
        const lower = source.toLocaleLowerCase();
        let cursor = 0, index = lower.indexOf(query);
        if (index < 0) return;
        const fragment = document.createDocumentFragment();
        while (index >= 0) {
          fragment.append(document.createTextNode(source.slice(cursor, index)));
          const hit = document.createElement('span');
          hit.className = 'search-hit';
          hit.textContent = source.slice(index, index + query.length);
          fragment.append(hit);
          cursor = index + query.length;
          index = lower.indexOf(query, cursor);
        }
        fragment.append(document.createTextNode(source.slice(cursor)));
        node.replaceWith(fragment);
      });
      state.hits = [...doc.querySelectorAll('.search-hit')];
      state.hitIndex = state.hits.length ? 0 : -1;
      updateSearchHit();
    }

    function moveSearch(delta) {
      if (!state.hits.length) return;
      state.hitIndex = (state.hitIndex + delta + state.hits.length) % state.hits.length;
      updateSearchHit();
    }

    function updateSearchHit() {
      state.hits.forEach((hit, index) => hit.classList.toggle('active', index === state.hitIndex));
      document.getElementById('searchCount').textContent = state.hits.length ? `${state.hitIndex + 1}/${state.hits.length}` : '0/0';
      state.hits[state.hitIndex]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // --- Edited-DOCX export: serialize the saved DOM back into style blocks that
    // DocxStyledExporter turns into WordprocessingML inside the original package. ---

    function pxToTwips(value) {
      if (!value || !value.endsWith('px')) return 0;
      const px = parseFloat(value);
      return Number.isFinite(px) && px > 0 ? Math.round(px * 15) : 0;
    }

    function cssHex(value) {
      if (!value) return '';
      const hex = /^#([0-9a-f]{6})$/i.exec(value);
      if (hex) return hex[1].toUpperCase();
      const rgb = /^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/.exec(value);
      if (!rgb) return '';
      return [1, 2, 3].map(i => Number(rgb[i]).toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function mergeRunStyle(base, el) {
      const style = el.style;
      const merged = { ...base };
      if (!style) return merged;
      if (style.fontWeight) merged.b = style.fontWeight === 'bold' || Number(style.fontWeight) >= 600;
      if (style.fontStyle) merged.i = style.fontStyle === 'italic';
      const deco = style.textDecorationLine || style.textDecoration;
      if (deco) merged.u = deco.includes('underline');
      const color = cssHex(style.color);
      if (color) merged.color = color;
      const fill = cssHex(style.backgroundColor);
      if (fill) merged.fill = fill;
      if (style.fontSize && style.fontSize.endsWith('px')) {
        const px = parseFloat(style.fontSize);
        if (Number.isFinite(px) && px > 0) merged.sz = Math.max(2, Math.round(px / 1.3333 * 2));
      }
      if (style.verticalAlign === 'super') merged.va = 'superscript';
      else if (style.verticalAlign === 'sub') merged.va = 'subscript';
      return merged;
    }

    function collectDocxRuns(el, inherited, runs) {
      for (let node = el.firstChild; node; node = node.nextSibling) {
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.data) runs.push({ ...inherited, t: node.data });
          continue;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) continue;
        if (node.classList.contains('docx-page-break')) { runs.push({ pb: true }); continue; }
        collectDocxRuns(node, mergeRunStyle(inherited, node), runs);
      }
    }

    function docxParagraphBlock(el) {
      const block = { type: 'p', runs: [] };
      const styleName = el.getAttribute('data-style');
      if (styleName) block.style = styleName;
      const num = el.getAttribute('data-num');
      if (num && /^\d{1,2}:\d{1,6}$/.test(num)) block.num = num;
      const style = el.style;
      if (style) {
        if (style.textAlign) block.jc = style.textAlign === 'justify' ? 'both' : style.textAlign;
        const indLeft = pxToTwips(style.marginLeft); if (indLeft) block.indLeft = indLeft;
        const indRight = pxToTwips(style.marginRight); if (indRight) block.indRight = indRight;
        const spBefore = pxToTwips(style.marginTop); if (spBefore) block.spBefore = spBefore;
        const spAfter = pxToTwips(style.marginBottom); if (spAfter) block.spAfter = spAfter;
        const fill = cssHex(style.backgroundColor); if (fill) block.fill = fill;
      }
      const inline = !DOCX_BLOCK_TAGS.has(el.tagName);
      collectDocxRuns(el, inline ? mergeRunStyle({}, el) : {}, block.runs);
      return block;
    }

    function docxTableBlock(el) {
      const rows = [];
      el.querySelectorAll(':scope > thead > tr, :scope > tbody > tr, :scope > tfoot > tr, :scope > tr')
        .forEach(tr => {
          const cells = [];
          tr.querySelectorAll(':scope > td, :scope > th').forEach(td => {
            const cell = { blocks: [] };
            const fill = cssHex(td.style.backgroundColor);
            if (fill) cell.fill = fill;
            serializeDocxBlocks(td, cell.blocks);
            cells.push(cell);
          });
          if (cells.length) rows.push(cells);
        });
      return { type: 'table', rows };
    }

    function serializeDocxBlocks(root, out) {
      for (let node = root.firstChild; node; node = node.nextSibling) {
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.data.trim()) out.push({ type: 'p', runs: [{ t: node.data }] });
          continue;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) continue;
        if (node.tagName === 'TABLE') out.push(docxTableBlock(node));
        else out.push(docxParagraphBlock(node));
      }
      return out;
    }

    function docxExportBlocks() {
      const template = document.createElement('template');
      template.innerHTML = state.html;
      return serializeDocxBlocks(template.content, []);
    }

    function exportDocument() {
      if (!state.text || state.editing) return;
      if (state.format === 'DOCX' && state.edited && state.html) {
        bridge('exportDocument', JSON.stringify(docxExportBlocks()));
      } else {
        bridge('exportDocument', '');
      }
    }

    (() => {
      const resetButton = document.getElementById('docxZoomReset');
      let pressTimer = 0;
      let longPressed = false;
      let startX = 0;
      let startY = 0;
      const openTheme = () => {
        longPressed = true;
        openSheet('docxThemeSheet');
        if (navigator.vibrate) navigator.vibrate(20);
      };
      resetButton.addEventListener('pointerdown', event => {
        longPressed = false;
        startX = event.clientX; startY = event.clientY;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(openTheme, 550);
      });
      resetButton.addEventListener('pointermove', event => {
        if (Math.hypot(event.clientX - startX, event.clientY - startY) > 12) clearTimeout(pressTimer);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(type =>
        resetButton.addEventListener(type, () => clearTimeout(pressTimer)));
      resetButton.addEventListener('contextmenu', event => {
        event.preventDefault();
        clearTimeout(pressTimer);
        if (!longPressed) openTheme();
      });
      resetButton.addEventListener('click', () => {
        if (longPressed) { longPressed = false; return; }
        resetDocZoom();
      });
    })();

    function openSheet(id) { document.getElementById(id).hidden = false; }
    function closeSheet(id) { if (id === 'aiSheet') closeAiChat(); else document.getElementById(id).hidden = true; }
    function backdropClose(event) {
      if (event.target !== event.currentTarget) return;
      if (performance.now() < annotationTapGuardUntil) {
        annotationTapGuardUntil = 0;
        return;
      }
      event.currentTarget.hidden = true;
    }

    function storageGet(key, fallback = '') {
      try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; }
    }

    function storageSet(key, value) {
      try { localStorage.setItem(key, value); } catch (_) { /* WebView storage can be disabled. */ }
    }

    function applySettings() {
      const size = Math.max(15, Math.min(30, Number(document.getElementById('fontSize').value) || 19));
      const line = Math.max(1.35, Math.min(2.4, Number(document.getElementById('lineHeight').value) || 1.85));
      const spacing = Math.max(0, Math.min(2, Number(document.getElementById('paragraphSpacing').value) || 0));
      const ratio = state.title && !state.loading && !state.restoringProgress ? readingProgressRatio() : null;
      document.documentElement.style.setProperty('--font-size', `${size}px`);
      document.documentElement.style.setProperty('--line-height', String(line));
      document.documentElement.style.setProperty('--paragraph-spacing', `${spacing}em`);
      document.getElementById('fontSizeValue').textContent = `${size}px`;
      document.getElementById('lineHeightValue').textContent = line.toFixed(2);
      document.getElementById('paragraphSpacingValue').textContent = `${spacing.toFixed(2).replace(/0+$/, '').replace(/\.$/, '')}em`;
      // Inline TXT values make the controls effective even on WebViews that cache custom
      // properties while a large text node is being reflowed.
      if (state.format === 'TXT' && state.title) {
        doc.style.fontSize = `${size}px`;
        doc.style.lineHeight = String(line);
      } else {
        doc.style.removeProperty('font-size');
        doc.style.removeProperty('line-height');
      }
      storageSet('reader-font-size', String(size));
      storageSet('reader-line-height', String(line));
      storageSet('reader-paragraph-spacing', String(spacing));
      if (ratio !== null) requestAnimationFrame(() => {
        const maxScroll = Math.max(0, reader.scrollHeight - reader.clientHeight);
        setReaderScrollTop(Math.round(maxScroll * ratio));
      });
    }

    function resetSettings() {
      document.getElementById('fontSize').value = '19';
      document.getElementById('lineHeight').value = '1.85';
      document.getElementById('paragraphSpacing').value = '0.85';
      applySettings(); setTheme('light');
      showToast('阅读设置已恢复默认');
    }

    function setTheme(theme) {
      const dark = theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('lightTheme').classList.toggle('active', !dark);
      document.getElementById('darkTheme').classList.toggle('active', dark);
      document.getElementById('docxLightTheme').classList.toggle('active', !dark);
      document.getElementById('docxDarkTheme').classList.toggle('active', dark);
      storageSet('reader-theme', theme);
      bridge('setDarkMode', dark);
    }

    function restoreSettings() {
      document.getElementById('fontSize').value = storageGet('reader-font-size', '19');
      document.getElementById('lineHeight').value = storageGet('reader-line-height', '1.85');
      document.getElementById('paragraphSpacing').value = storageGet('reader-paragraph-spacing', '0.85');
      applySettings();
      setTheme(storageGet('reader-theme', 'light'));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message; toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    document.getElementById('aiPrompt').addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); sendAi(); }
    });
    document.getElementById('aiPagePrompt').addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); sendAiPage(); }
    });

    setupAiResize();
    restoreSettings();
    renderHome();
    bridge('getRecentFiles');
    bridge('getAiState');
  </script>
</body>
</html>
